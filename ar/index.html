<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>AR | 人とロボットの境界線</title>
<meta name="description" content="ロボットアームにカメラを向けると、動画が流れます。">

<!--
  AR はこの1ページにまとめている。画像トラッキングには MindAR を使う。
  iOS Safari は WebXR の image tracking に対応していないため、
  getUserMedia 上で自前追跡する MindAR / 8th Wall しか実用的な選択肢がない。

  ■ 登録画像（targets.mind）
    コンパイラに入れた順番が targetIndex になる。この順で入れること。
      0: target.jpg       … SO-101 の動画（IMG_1793.MOV）の最初のコマ全体
      1: target_sign.jpg  … 同じコマから「フォローアーム 危ないから触らないで！」の
                            貼り紙だけを切り出したもの
      2: 配布する紙面の PNG（tools/make_sheet.py の出力）… まだ入れていない
    作り方:
      1. https://hiukim.github.io/mind-ar-js-doc/tools/compile を開く
      2. 上の画像を順番どおりに1枚ずつ入れて Start
      3. ダウンロードした .mind を targets.mind という名前でこのフォルダに置く
    targets.mind に入っていない番号の <a-entity> は使われないだけで、害はない。
    紙面を足すときは 0, 1 も含めて3枚で作り直し、下のゲートの文言も紙に触れる形に直す。

  ■ 紙面のマーカーについて
    マーカーにするのは「QR単体」ではなく「紙面全体」。QRの格子は自己相似で
    特徴点が乏しく、追跡が安定しない。

  ■ 動画（so101.mp4）
    IMG_1793.MOV（iPhone 縦撮り 1080x1920・約23秒）を 720x1280 の H.264 に変換し、
    音声は外してある。そのため muted のまま自動再生でき、音の許可は要らない。
    IMG_1793.MOV は重いので .gitignore で Git から外している。

  ■ 背景（カメラ映像）について
    MindAR はカメラ映像の <video> を body の中に z-index:-2 で置く。
    body に背景色を付けると、その背景色が映像より手前に描かれて画面が真っ黒になる。
    背景色は html にだけ付け、body は透明のままにすること。
-->
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
  :root {
    --bg: #07080a; --ink: #ecebe8; --red: #ff2040; --cyan: #35e8e0;
    --mono: "SFMono-Regular", Consolas, monospace;
    --sans: "Noto Sans JP", "Yu Gothic", "Hiragino Kaku Gothic ProN", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  /* 背景色は html にだけ付ける。body に付けるとカメラ映像が隠れる（上のコメント参照） */
  html { height: 100%; background: var(--bg); }
  body { margin: 0; height: 100%; background: transparent; color: var(--ink); font-family: var(--sans); }
  a { color: inherit; }

  .ui { position: fixed; inset: 0; z-index: 10; pointer-events: none; }
  .ui[hidden] { display: none; }

  .ui__bar {
    position: absolute; top: 0; left: 0; right: 0;
    display: flex; align-items: center; justify-content: space-between;
    padding: .8rem 1rem;
    background: linear-gradient(rgba(8,9,12,.9), transparent);
    pointer-events: auto;
  }
  .ui__org { font-family: var(--mono); font-size: .7rem; letter-spacing: .18em; color: var(--red); }
  .ui__back { font-size: .78rem; text-decoration: none; border-bottom: 1px solid var(--red); }

  .ui__status {
    position: absolute; bottom: 1.4rem; left: 50%; transform: translateX(-50%);
    font-family: var(--mono); font-size: .72rem; letter-spacing: .14em;
    background: rgba(8,9,12,.82); border: 1px solid #23262e;
    padding: .55rem 1rem; white-space: nowrap;
  }
  .ui__status b { color: var(--cyan); font-weight: 400; }

  /* 起動前のゲート。カメラ許可はユーザー操作から始める */
  .gate {
    position: fixed; inset: 0; z-index: 20;
    display: flex; flex-direction: column; justify-content: center;
    gap: 1.6rem; padding: 2rem 1.5rem;
    background: var(--bg);
  }
  .gate[hidden] { display: none; }
  .gate__org { font-family: var(--mono); font-size: .7rem; letter-spacing: .2em; color: var(--red); }
  .gate__title { font-size: 1.7rem; font-weight: 900; line-height: 1.4; margin: 0; }
  .gate__body { font-size: .88rem; line-height: 1.9; color: #b6b3ac; margin: 0; max-width: 30rem; }
  .gate__btn {
    align-self: flex-start;
    background: var(--red); color: #fff; border: 0;
    font-family: inherit; font-size: .92rem; font-weight: 700; letter-spacing: .08em;
    padding: .95rem 1.8rem; cursor: pointer;
  }
  .gate__btn:disabled { background: #2a2e36; color: #767c86; cursor: not-allowed; }
  .gate__note { font-size: .72rem; color: #8b9099; margin: 0; }
  .gate__err {
    font-family: var(--mono); font-size: .74rem; color: var(--red);
    border: 1px solid var(--red); padding: .7rem .9rem; margin: 0;
  }
  .gate__err[hidden] { display: none; }

  /* テクスチャの元になる video。画面には出さない */
  #vid { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
</style>
</head>
<body>

<!--
  video は a-assets に入れない。a-assets は中の素材の読み込みを待ってから
  シーンを始めるため、動画が重いと起動が止まる。外に置いて #vid で参照する。
-->
<video id="vid" src="./so101.mp4" preload="auto" loop muted playsinline webkit-playsinline></video>

<div class="gate" id="gate">
  <p class="gate__org">人とロボットの境界線</p>
  <h1 class="gate__title">ロボットアームに<br>カメラを向けてください</h1>
  <p class="gate__body">
    アームと、机の上の貼り紙が画面に入るようにしてください。
    見つかると、その上に動画が流れます。
  </p>
  <button class="gate__btn" id="start">カメラを起動する</button>
  <p class="gate__note">映像は端末内でのみ処理され、送信も保存もされません。</p>
  <p class="gate__err" id="err" hidden></p>
</div>

<div class="ui" id="ui" hidden>
  <div class="ui__bar">
    <span class="ui__org">SCANNING</span>
    <a class="ui__back" href="../">もどる</a>
  </div>
  <p class="ui__status" id="status">探しています <b>...</b></p>
</div>

<a-scene
  id="scene"
  mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiScanning: no; uiLoading: no; uiError: no; filterMinCF: 0.0001; filterBeta: 0.001"
  color-space="sRGB"
  renderer="colorManagement: true, physicallyCorrectLights"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <!-- クリック判定は使わないので cursor / raycaster は載せない
       （載せると raycaster.objects 未指定の警告が出るうえ無駄に重い） -->
  <a-camera position="0 0 0"
            look-controls="enabled: false"
            wasd-controls="enabled: false"></a-camera>

  <!--
    ===== SO-101（0, 1）=====
    座標の単位は「その登録画像の幅 = 1」、原点は登録画像の中心、上が +Y。
    動画の板は、撮影したときの画面全体（= target.jpg）とぴったり重なる位置に置く。
      0: target.jpg そのものなので 幅 1・中心 (0, 0)
      1: 貼り紙の切り出し（元画像 1080x1920 の x=60, y=1120 から 940x500）なので、
         幅 = 1080 / 940 = 1.149
         中心 = ((540 - 530) / 940, (1370 - 960) / 940) = (0.011, 0.436)
    板の高さは動画の縦横比から JS で決める。
  -->
  <a-entity class="robot" mindar-image-target="targetIndex: 0">
    <a-video class="screen" src="#vid" width="1" position="0 0 0.01"></a-video>
  </a-entity>

  <a-entity class="robot" mindar-image-target="targetIndex: 1">
    <a-video class="screen" src="#vid" width="1.149" position="0.011 0.436 0.01"></a-video>
  </a-entity>

  <!--
    ===== 配布する紙（2）=====
    座標系は「紙面の幅 = 1」。原点は紙の中心、上が +Y。
    A4縦(210x297mm)なので上下端は y = ±0.707。

    下の座標は目分量ではなく make_sheet.py が実測して出力したもの。
    紙面のレイアウトを変えたら make_sheet.py を再実行し、
    出力された「ARオーバーレイ座標」で置き換えること。
  -->
  <a-entity id="paper" mindar-image-target="targetIndex: 2">

    <!-- CAPTCHA欄に入るチェック。紙の上では永久に空欄のままの箇所。
         make_sheet.py 実測値: 中心 (-0.166, -0.031) / 枠の幅 0.039 -->
    <a-entity id="check" position="-0.166 -0.031 0.01" scale="0 0 0">
      <a-plane width="0.019" height="0.006" color="#ff2040"
               rotation="0 0 45" position="-0.009 -0.004 0"></a-plane>
      <a-plane width="0.034" height="0.006" color="#ff2040"
               rotation="0 0 -45" position="0.005 0.004 0"></a-plane>
    </a-entity>

    <!-- 判定結果。チェック欄の少し下に出す -->
    <a-entity id="verdict" position="0 -0.115 0.01" scale="0 0 0">
      <a-plane width="0.62" height="0.062" color="#07080a" opacity="0.93"></a-plane>
      <a-text value="判定: 確定できません" align="center" color="#35e8e0"
              width="1.1" position="0 0.011 0.001"></a-text>
      <a-text value="THE LINE IS NOT WHERE YOU THINK" align="center" color="#767c86"
              width="0.8" position="0 -0.017 0.001"></a-text>
    </a-entity>

    <!-- 紙面を囲む照合フレーム。A4縦の外周に合わせる -->
    <a-entity id="frame" scale="0 0 0">
      <a-plane width="0.98" height="0.005" color="#ff2040" position="0 0.688 0"></a-plane>
      <a-plane width="0.98" height="0.005" color="#ff2040" position="0 -0.688 0"></a-plane>
      <a-plane width="0.005" height="1.381" color="#ff2040" position="-0.49 0 0"></a-plane>
      <a-plane width="0.005" height="1.381" color="#ff2040" position="0.49 0 0"></a-plane>
    </a-entity>

  </a-entity>
</a-scene>

<script>
(() => {
  'use strict';

  const $ = (id) => document.getElementById(id);
  const gate    = $('gate');
  const err     = $('err');
  const ui      = $('ui');
  const status  = $('status');
  const scene   = $('scene');
  const vid     = $('vid');
  const btn     = $('start');
  const paper   = $('paper');
  const robots  = document.querySelectorAll('.robot');
  const screens = document.querySelectorAll('.screen');

  const SEARCHING = '探しています <b>...</b>';

  const fail = (msg) => {
    err.textContent = msg;
    err.hidden = false;
  };

  const exists = async (url) => {
    try {
      const res = await fetch(url, { method: 'HEAD' });
      return res.ok;
    } catch (e) {
      return false;
    }
  };

  /* 起動前に環境を検査する。ここを通さないと、原因の違う失敗が
     すべて「Failed to fetch」に化けて切り分けられなくなる。 */
  const preflight = async () => {
    if (location.protocol === 'file:') {
      return 'file:// で開いています。ローカルサーバ経由で開いてください。'
           + '  例: python -m http.server 8000';
    }
    // getUserMedia は secure context 必須。https か localhost 以外では動かない
    if (!window.isSecureContext) {
      return 'このURLではカメラを使えません（https または localhost が必要）。'
           + ' LAN の http://192.168.x.x では起動しません。';
    }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      return 'このブラウザはカメラ入力に対応していません。';
    }
    if (!(await exists('./targets.mind'))) {
      return 'targets.mind が見つかりません。MindAR のコンパイラで登録画像から'
           + '生成して ar/ に置いてください。'
           + ' https://hiukim.github.io/mind-ar-js-doc/tools/compile';
    }
    if (!(await exists('./so101.mp4'))) {
      return 'so101.mp4 が見つかりません。ar/ に置いてください。';
    }
    return null;
  };

  preflight().then((problem) => {
    if (!problem) return;
    fail(problem);
    btn.disabled = true;
    btn.textContent = '起動できません';
  });

  // 動画の板の高さを、動画の実際の縦横比に合わせる（幅は各板の width のまま）
  const fitScreens = () => {
    if (!vid.videoWidth) return;
    const ratio = vid.videoHeight / vid.videoWidth;
    screens.forEach((s) => {
      s.setAttribute('height', Number(s.getAttribute('width')) * ratio);
    });
  };
  vid.addEventListener('loadedmetadata', fitScreens);
  fitScreens();

  btn.addEventListener('click', async () => {
    const sys = scene.systems && scene.systems['mindar-image-system'];
    if (!sys) {
      fail('ARエンジンを読み込めませんでした。通信環境を確認して再読み込みしてください。');
      return;
    }
    const problem = await preflight();
    if (problem) { fail(problem); return; }

    // タップの中で一度再生しておく。iOS はこれをしないと、
    // あとから targetFound で play() しても止められることがある。
    vid.play().then(() => vid.pause()).catch(() => {});

    btn.disabled = true;
    try {
      await sys.start();
      gate.hidden = true;
      ui.hidden = false;
    } catch (e) {
      btn.disabled = false;
      fail('カメラを起動できませんでした。ブラウザのカメラ許可を確認してください。'
           + ' (' + (e && e.name ? e.name : 'error') + ')');
    }
  });

  /* ----- SO-101：どれか1枚でも見つかっていれば再生。全部見失ったら一時停止 ----- */
  let robotTracking = 0;
  robots.forEach((t) => {
    t.addEventListener('targetFound', () => {
      robotTracking++;
      status.innerHTML = 'SO-101 を検出 <b>/ 再生中</b>';
      vid.play().catch(() => {
        status.innerHTML = '動画を再生できません <b>/ 再読み込みしてください</b>';
      });
    });
    t.addEventListener('targetLost', () => {
      robotTracking = Math.max(0, robotTracking - 1);
      if (robotTracking > 0) return;
      vid.pause();
      status.innerHTML = SEARCHING;
    });
  });

  /* ----- 配布する紙：枠 → チェック → 判定 の順で見せる ----- */
  const show = (id, s) => $(id).setAttribute('scale', s + ' ' + s + ' ' + s);
  let timer = null;

  paper.addEventListener('targetFound', () => {
    status.innerHTML = '紙を検出 <b>/ 照合中</b>';
    show('frame', 1);
    clearTimeout(timer);
    timer = setTimeout(() => {
      show('check', 1);
      timer = setTimeout(() => {
        show('verdict', 1);
        status.innerHTML = '判定 <b>確定できません</b>';
      }, 1100);
    }, 500);
  });

  paper.addEventListener('targetLost', () => {
    clearTimeout(timer);
    ['frame', 'check', 'verdict'].forEach((id) => show(id, 0));
    if (robotTracking === 0) status.innerHTML = SEARCHING;
  });
})();
</script>
</body>
</html>
