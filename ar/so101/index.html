<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>AR SO-101 | 人とロボットの境界線</title>
<meta name="description" content="ロボットアーム SO-101 にカメラを向けると、動画が流れます。">

<!--
  SO-101 にカメラを向けると、その上に動画を重ねて再生する。
  仕組みは ../index.html と同じ MindAR の画像トラッキング。

  ■ targets.mind の作り方（2枚をこの順で登録する）
    1. https://hiukim.github.io/mind-ar-js-doc/tools/compile を開く
    2. 次の2枚を、この順番でまとめてアップロードする
         0: target.jpg       … 動画の最初のコマ全体
         1: target_sign.jpg  … 同じコマから「フォローアーム 危ないから触らないで！」の
                               貼り紙だけを切り出したもの
    3. 出力された targets.mind をこのフォルダに置く
    1枚だけ（target.jpg だけ）で作っても動く。使われない targetIndex: 1 は無視される。

  ■ 登録する画像を増やすとき
    コンパイラに入れた順番が targetIndex（0, 1, 2 ...）になる。
    下の <a-entity mindar-image-target> を1つ複製して targetIndex を合わせる。
    どの画像が見つかっても、同じ1本の動画を再生する。

  ■ 動画の板の置き方
    座標の単位は「その登録画像の幅 = 1」、原点は登録画像の中心、上が +Y。
    動画の板は、撮影したときの画面全体（= target.jpg）とぴったり重なる位置に置く。
      0: target.jpg そのものなので 幅 1・中心 (0, 0)
      1: 貼り紙の切り出し（元画像 1080x1920 の x=60, y=1120 から 940x500）なので、
         幅 = 1080 / 940 = 1.149
         中心 = ((540 - 530) / 940, (1370 - 960) / 940) = (0.011, 0.436)
    板の高さは動画の縦横比から JS で決める。

  ■ 動画（so101.mp4）
    元は IMG_1793.MOV（iPhone 縦撮り 1080x1920・約23秒）。720x1280 の H.264 に変換し、
    音声は外してある。そのため muted のまま自動再生でき、音の許可は要らない。
-->
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
  :root {
    --bg: #07080a; --ink: #ecebe8; --red: #ff2040; --cyan: #35e8e0;
    --mono: "SFMono-Regular", Consolas, monospace;
    --sans: "Noto Sans JP", "Yu Gothic", "Hiragino Kaku Gothic ProN", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--sans); }
  a { color: inherit; }

  .ui { position: fixed; inset: 0; z-index: 10; pointer-events: none; }
  .ui[hidden] { display: none; }

  .ui__bar {
    position: absolute; top: 0; left: 0; right: 0;
    display: flex; align-items: center; justify-content: space-between;
    padding: .8rem 1rem;
    background: linear-gradient(rgba(8,9,12,.9), transparent);
    pointer-events: auto;
  }
  .ui__org { font-family: var(--mono); font-size: .7rem; letter-spacing: .18em; color: var(--red); }
  .ui__back { font-size: .78rem; text-decoration: none; border-bottom: 1px solid var(--red); }

  .ui__status {
    position: absolute; bottom: 1.4rem; left: 50%; transform: translateX(-50%);
    font-family: var(--mono); font-size: .72rem; letter-spacing: .14em;
    background: rgba(8,9,12,.82); border: 1px solid #23262e;
    padding: .55rem 1rem; white-space: nowrap;
  }
  .ui__status b { color: var(--cyan); font-weight: 400; }

  .gate {
    position: fixed; inset: 0; z-index: 20;
    display: flex; flex-direction: column; justify-content: center;
    gap: 1.6rem; padding: 2rem 1.5rem;
    background: var(--bg);
  }
  .gate[hidden] { display: none; }
  .gate__org { font-family: var(--mono); font-size: .7rem; letter-spacing: .2em; color: var(--red); }
  .gate__title { font-size: 1.7rem; font-weight: 900; line-height: 1.4; margin: 0; }
  .gate__body { font-size: .88rem; line-height: 1.9; color: #b6b3ac; margin: 0; max-width: 30rem; }
  .gate__btn {
    align-self: flex-start;
    background: var(--red); color: #fff; border: 0;
    font-family: inherit; font-size: .92rem; font-weight: 700; letter-spacing: .08em;
    padding: .95rem 1.8rem; cursor: pointer;
  }
  .gate__btn:disabled { background: #2a2e36; color: #767c86; cursor: not-allowed; }
  .gate__note { font-size: .72rem; color: #8b9099; margin: 0; }
  .gate__err {
    font-family: var(--mono); font-size: .74rem; color: var(--red);
    border: 1px solid var(--red); padding: .7rem .9rem; margin: 0;
  }
  .gate__err[hidden] { display: none; }

  /* テクスチャの元になる video。画面には出さない */
  #vid { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
</style>
</head>
<body>

<!--
  video は a-assets に入れない。a-assets は中の素材の読み込みを待ってから
  シーンを始めるため、動画が重いと起動が止まる。外に置いて #vid で参照する。
-->
<video id="vid" src="./so101.mp4" preload="auto" loop muted playsinline webkit-playsinline></video>

<div class="gate" id="gate">
  <p class="gate__org">人とロボットの境界線 / SO-101</p>
  <h1 class="gate__title">ロボットアームに<br>カメラを向けてください</h1>
  <p class="gate__body">
    アームと、机の上の貼り紙が画面に入るようにしてください。
    見つかると、その上に動画が流れます。
  </p>
  <button class="gate__btn" id="start">カメラを起動する</button>
  <p class="gate__note">映像は端末内でのみ処理され、送信も保存もされません。</p>
  <p class="gate__err" id="err" hidden></p>
</div>

<div class="ui" id="ui" hidden>
  <div class="ui__bar">
    <span class="ui__org">SCANNING / SO-101</span>
    <a class="ui__back" href="../../">もどる</a>
  </div>
  <p class="ui__status" id="status">ロボットを探しています <b>...</b></p>
</div>

<a-scene
  id="scene"
  mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiScanning: no; uiLoading: no; uiError: no; filterMinCF: 0.0001; filterBeta: 0.001"
  color-space="sRGB"
  renderer="colorManagement: true, physicallyCorrectLights"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-camera position="0 0 0"
            look-controls="enabled: false"
            wasd-controls="enabled: false"></a-camera>

  <!-- 0: target.jpg（最初のコマ全体）。板はそのまま重ねる -->
  <a-entity class="target" mindar-image-target="targetIndex: 0">
    <a-video class="screen" src="#vid" width="1" position="0 0 0.01"></a-video>
  </a-entity>

  <!-- 1: target_sign.jpg（貼り紙だけ）。板は撮影時の画面全体の位置までずらす -->
  <a-entity class="target" mindar-image-target="targetIndex: 1">
    <a-video class="screen" src="#vid" width="1.149" position="0.011 0.436 0.01"></a-video>
  </a-entity>
</a-scene>

<script>
(() => {
  'use strict';

  const gate    = document.getElementById('gate');
  const err     = document.getElementById('err');
  const ui      = document.getElementById('ui');
  const status  = document.getElementById('status');
  const scene   = document.getElementById('scene');
  const vid     = document.getElementById('vid');
  const btn     = document.getElementById('start');
  const targets = document.querySelectorAll('.target');
  const screens = document.querySelectorAll('.screen');

  const fail = (msg) => {
    err.textContent = msg;
    err.hidden = false;
  };

  const exists = async (url) => {
    try {
      const res = await fetch(url, { method: 'HEAD' });
      return res.ok;
    } catch (e) {
      return false;
    }
  };

  const preflight = async () => {
    if (location.protocol === 'file:') {
      return 'file:// で開いています。ローカルサーバ経由で開いてください。'
           + '  例: python -m http.server 8000';
    }
    if (!window.isSecureContext) {
      return 'このURLではカメラを使えません（https または localhost が必要）。'
           + ' LAN の http://192.168.x.x では起動しません。';
    }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      return 'このブラウザはカメラ入力に対応していません。';
    }
    if (!(await exists('./targets.mind'))) {
      return 'targets.mind が見つかりません。MindAR のコンパイラで target.jpg と'
           + ' target_sign.jpg から生成して ar/so101/ に置いてください。'
           + ' https://hiukim.github.io/mind-ar-js-doc/tools/compile';
    }
    if (!(await exists('./so101.mp4'))) {
      return 'so101.mp4 が見つかりません。ar/so101/ に置いてください。';
    }
    return null;
  };

  preflight().then((problem) => {
    if (!problem) return;
    fail(problem);
    btn.disabled = true;
    btn.textContent = '起動できません';
  });

  // 板の高さを動画の実際の縦横比に合わせる（幅は各板の width のまま）
  const fitScreens = () => {
    if (!vid.videoWidth) return;
    const ratio = vid.videoHeight / vid.videoWidth;
    screens.forEach((s) => {
      s.setAttribute('height', Number(s.getAttribute('width')) * ratio);
    });
  };
  vid.addEventListener('loadedmetadata', fitScreens);
  fitScreens();

  btn.addEventListener('click', async () => {
    const sys = scene.systems && scene.systems['mindar-image-system'];
    if (!sys) {
      fail('ARエンジンを読み込めませんでした。通信環境を確認して再読み込みしてください。');
      return;
    }
    const problem = await preflight();
    if (problem) { fail(problem); return; }

    // タップの中で一度再生しておく。iOS はこれをしないと、
    // あとから targetFound で play() しても止められることがある。
    vid.play().then(() => vid.pause()).catch(() => {});

    btn.disabled = true;
    try {
      await sys.start();
      gate.hidden = true;
      ui.hidden = false;
    } catch (e) {
      btn.disabled = false;
      fail('カメラを起動できませんでした。ブラウザのカメラ許可を確認してください。'
           + ' (' + (e && e.name ? e.name : 'error') + ')');
    }
  });

  // どれか1枚でも見つかっていれば再生。全部見失ったら一時停止（続きから再開）
  let tracking = 0;
  targets.forEach((t) => {
    t.addEventListener('targetFound', () => {
      tracking++;
      status.innerHTML = 'SO-101 を検出 <b>/ 再生中</b>';
      vid.play().catch(() => {
        status.innerHTML = '動画を再生できません <b>/ 再読み込みしてください</b>';
      });
    });
    t.addEventListener('targetLost', () => {
      tracking = Math.max(0, tracking - 1);
      if (tracking > 0) return;
      status.innerHTML = 'ロボットを探しています <b>...</b>';
      vid.pause();
    });
  });
})();
</script>
</body>
</html>
